include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 4566
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 4566
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "wager-transactions-dlq.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "wager-events.fifo" {
    fifo = true
    contentBasedDeduplication = false
  }
  "wager-transactions.fifo" {
    fifo = true
    contentBasedDeduplication = false
    deadLettersQueue {
      name = "wager-transactions-dlq.fifo"
      maxReceiveCount = 5
    }
  }
}
